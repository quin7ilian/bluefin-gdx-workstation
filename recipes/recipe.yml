---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: bluefin-gdx-workstation
description: >-
  Custom Bluefin GDX LTS for an HPO/ML workstation.
  Adds 1Password, Brave, Insync (GUI + Nautilus), and Zed.
  Disables zram, applies HPO sysctl/THP tunings, sets nvidia-drm.modeset=0
  for AMD-primary + Nvidia-compute-only multi-GPU config.

base-image: ghcr.io/ublue-os/bluefin-gdx
image-version: lts

modules:
  # ─── System config files ─────────────────────────────────────────────
  # zram-generator override (empty file), sysctl tunings, THP tmpfiles.d,
  # systemd user unit for insync, ujust recipes.
  - type: files
    files:
      - source: system
        destination: /

  # ─── Kernel cmdline: disable DRM modeset on Nvidia GPUs ──────────────
  # Required for AMD-primary-display + Nvidia-compute-only setup.
  # Prevents Mutter from scheduling work on the 4090s and doing
  # expensive cross-GPU framebuffer copies. CUDA is unaffected
  # (CUDA uses /dev/nvidia* char devices, not DRM).
  #
  # Why this is a `script` module, not a `kargs` module:
  # the Bluefin GDX base image ships /usr/lib/bootc/kargs.d/00-nvidia.toml
  # with `nvidia-drm.modeset=1` (uBlue's standard Nvidia-display config,
  # required for Wayland-on-Nvidia setups). A separate kargs.d file
  # setting `=0` does NOT override it — bootc upstream documents
  # cross-file karg removal/override as "currently undefined behavior"
  # and empirically the base's `=1` wins on /proc/cmdline. The reliable
  # fix is to edit the base's file in place; the BlueBuild `files`
  # module's cp -rf would also work, but `sed -i` survives upstream
  # adding new kargs to that file.
  #
  # Fail loudly if the base ever changes the karg name or value — better
  # to break the build than silently boot with the wrong cmdline.
  - type: script
    snippets:
      - |
        set -euo pipefail
        karg_file=/usr/lib/bootc/kargs.d/00-nvidia.toml
        test -f "$karg_file" || { echo "ERROR: $karg_file missing — Bluefin GDX base layout changed, recipe needs update"; exit 1; }
        grep -q 'nvidia-drm.modeset=1' "$karg_file" || { echo "ERROR: $karg_file no longer contains 'nvidia-drm.modeset=1' — base changed, recipe needs update"; cat "$karg_file"; exit 1; }
        sed -i 's/nvidia-drm.modeset=1/nvidia-drm.modeset=0/g' "$karg_file"
        grep -q 'nvidia-drm.modeset=0' "$karg_file"
        ! grep -q 'nvidia-drm.modeset=1' "$karg_file"
        echo "Patched $karg_file:"
        cat "$karg_file"

  # ─── Third-party RPMs in a single dnf transaction ────────────────────
  # CS10 ships dnf4, not dnf5 — the BlueBuild `dnf` module will not work
  # on this base. Using the `script` module with `dnf install` instead.
  - type: script
    snippets:
      - |
        set -euo pipefail

        # --- 1Password ---
        rpm --import https://downloads.1password.com/linux/keys/1password.asc
        cat > /etc/yum.repos.d/1password.repo << 'EOF'
        [1password]
        name=1Password Stable Channel
        baseurl=https://downloads.1password.com/linux/rpm/stable/$basearch
        enabled=1
        gpgcheck=1
        repo_gpgcheck=1
        gpgkey=https://downloads.1password.com/linux/keys/1password.asc
        EOF

        # --- Brave (key file is brave-core.asc, not brave-browser.asc) ---
        rpm --import https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
        cat > /etc/yum.repos.d/brave-browser.repo << 'EOF'
        [brave-browser]
        name=Brave Browser
        enabled=1
        gpgcheck=1
        gpgkey=https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
        baseurl=https://brave-browser-rpm-release.s3.brave.com/$basearch
        EOF

        # --- Insync (native EL10 repo, confirmed available 2026-05) ---
        # Install GUI + nautilus. The sync engine is started in the
        # background by a systemd --user unit (see
        # files/system/usr/lib/systemd/user/insync.service) so the GUI
        # is only opened when the user wants to configure or browse.
        rpm --import https://d2t3ff60b2tol4.cloudfront.net/repomd.xml.key
        cat > /etc/yum.repos.d/insync.repo << 'EOF'
        [insync]
        name=insync repo
        baseurl=https://yum.insync.io/centos/10/
        gpgcheck=1
        gpgkey=https://d2t3ff60b2tol4.cloudfront.net/repomd.xml.key
        enabled=1
        EOF

        # Single dnf transaction (faster than multiple).
        # gnome-browser-connector (CS10 AppStream) provides the native
        # messaging host so extensions.gnome.org "Install" buttons work
        # in Firefox/Chrome/Brave without manual rpm-ostree layering.
        dnf install -y \
          1password 1password-cli \
          brave-browser \
          insync insync-nautilus \
          gnome-browser-connector

        dnf clean all
        rm -rf /var/cache/dnf /var/cache/yum

  # ─── Thermal / IPMI: CoolerControl daemon + custom-device plugin ─────
  # CoolerControl has no native ipmitool support
  # (gitlab.com/coolercontrol/coolercontrol issue #540), so the IPMI ↔
  # CoolerControl bridge on this ASRock WRX80 Creator R2.0 uses the
  # official `cc-plugin-custom-device` plugin: it runs as a subprocess
  # of coolercontrold and shells out to whatever commands you declare
  # in /etc/coolercontrol/plugins/custom-device/manifest.toml for each
  # fan/temp channel (typically `ipmitool sensor` for reads, `ipmitool
  # raw …` for writes).
  #
  # The plugin's default manifest.toml is a placeholder — the WRX80's
  # per-channel raw command set has to be discovered empirically on the
  # live system (post-rebase), pasted in, with `privileged = true` set
  # so commands that need root can run. Once that manifest is stable it
  # can be baked into a subsequent image commit under
  # files/system/etc/coolercontrol/plugins/custom-device/.
  #
  # coolercontrold's web UI is on http://localhost:11987 — the Qt
  # `coolercontrol` desktop wrapper is intentionally NOT installed.
  - type: script
    snippets:
      - |
        set -euo pipefail

        # CoolerControl COPR (codifryed/CoolerControl). The COPR builds
        # for epel-10-x86_64; the .repo file is self-contained and does
        # not require EPEL itself to be enabled.
        curl -fsSL \
          https://copr.fedorainfracloud.org/coprs/codifryed/CoolerControl/repo/epel-10/codifryed-CoolerControl-epel-10.repo \
          -o /etc/yum.repos.d/codifryed-CoolerControl-epel-10.repo

        # ipmitool + lm_sensors + sudo from centos-appstream;
        # coolercontrold from the COPR. sudo is needed for the plugin
        # install.sh below (it uses sudo internally) and is generally
        # useful on the host.
        #
        # --setopt=install_weak_deps=False skips the python3-liquidctl
        # Recommend (would need EPEL; we have no liquid cooling). We add
        # lm_sensors explicitly because it IS wanted (CoolerControl uses
        # it for hwmon sensor discovery) and we don't want to rely on
        # weak-dep resolution to pull it.
        dnf install -y --setopt=install_weak_deps=False \
          ipmitool \
          lm_sensors \
          sudo \
          coolercontrold

        # cc-plugin-custom-device: installs the plugin binary, default
        # manifest.toml, and UI snippet to /etc/coolercontrol/plugins/
        # custom-device/. Download to a temp file first so a curl
        # failure surfaces as an error rather than silently producing
        # empty stdin into sh.
        curl -fsSL \
          https://gitlab.com/coolercontrol/cc-plugin-custom-device/-/raw/main/install.sh \
          -o /tmp/cc-plugin-install.sh
        sh /tmp/cc-plugin-install.sh
        rm /tmp/cc-plugin-install.sh

        dnf clean all
        rm -rf /var/cache/dnf /var/cache/yum

  # ─── Enable coolercontrold at boot ───────────────────────────────────
  # The COPR package ships the unit but doesn't preset-enable it, so
  # without this the web UI on :11987 is not reachable after a fresh
  # rebase. Must come AFTER the CoolerControl install module so the
  # unit file exists when `systemctl enable` runs at build time.
  - type: systemd
    system:
      enabled:
        - coolercontrold.service

  # ─── Profiling tools (kernel-coupled, must match running kernel) ─────
  # perf and bpftrace are built from the kernel source tree and read
  # kernel data structures whose ABI changes between versions; running
  # them inside a Distrobox produces cryptic errors, miscounted events,
  # or unresolved symbols because the container ships them built for a
  # different kernel. Same logic for ftrace consumers and anything
  # reading /sys/kernel/debug.
  #
  # Userland Python profilers (py-spy, scalene, austin, memray,
  # line_profiler, pyinstrument) read process memory rather than kernel
  # counters and are intentionally NOT installed here — those go in the
  # user's conda env via pip/uv.
  #
  # `kernel.perf_event_paranoid = 1` is set via the sysctl tunings, so
  # the user can run `perf stat` / `perf record` against own processes
  # without sudo.
  - type: script
    snippets:
      - |
        set -euo pipefail

        # All from CS10 AppStream/BaseOS — no third-party repos needed.
        dnf install -y \
          perf \
          bpftrace \
          sysstat \
          strace \
          ltrace \
          numactl \
          hwloc

        dnf clean all
        rm -rf /var/cache/dnf /var/cache/yum

  # ─── Zed editor (official upstream tarball) ──────────────────────────
  # Installed to /usr/lib/zed.app (part of the OS image, read-only at
  # runtime, updated only via image rebuilds). System-wide binary
  # symlink at /usr/bin/zed and system-wide .desktop entry.
  - type: script
    snippets:
      - |
        set -euo pipefail

        # zed.dev/api/.../latest/zed-linux-x86_64.tar.gz 307-redirects to
        # the corresponding github.com/zed-industries/zed release asset.
        # curl -L follows redirects, so this resolves to the current
        # stable build on each image rebuild.
        ZED_URL="https://zed.dev/api/releases/stable/latest/zed-linux-x86_64.tar.gz"
        TMP_TARBALL="$(mktemp /tmp/zed-XXXXXX.tar.gz)"
        trap 'rm -f "$TMP_TARBALL"' EXIT

        echo "Downloading latest stable Zed..."
        curl -fsSL "$ZED_URL" -o "$TMP_TARBALL"

        # The tarball expands to ./zed.app/ — extract directly into /usr/lib.
        mkdir -p /usr/lib
        tar -xzf "$TMP_TARBALL" -C /usr/lib/

        # System-wide terminal symlink. Zed 0.139+ consolidated the
        # separate bin/cli into bin/zed (one binary handles both the
        # terminal CLI shim and the GUI launcher). The official
        # install.sh has the same `if bin/cli exists else bin/zed`
        # fallback chain; we hard-code the new path since the LTS image
        # rebuilds against current stable.
        ln -sf /usr/lib/zed.app/bin/zed /usr/bin/zed

        # System-wide .desktop entry with absolute paths.
        # Newer tarballs ship dev.zed.Zed.desktop; older ones ship zed.desktop.
        # The official install.sh has this same fallback.
        src_desktop="/usr/lib/zed.app/share/applications/dev.zed.Zed.desktop"
        [ -f "$src_desktop" ] || src_desktop="/usr/lib/zed.app/share/applications/zed.desktop"
        install -Dm644 "$src_desktop" /usr/share/applications/dev.zed.Zed.desktop
        sed -i \
          -e "s|Icon=zed|Icon=/usr/lib/zed.app/share/icons/hicolor/512x512/apps/zed.png|" \
          -e "s|Exec=zed|Exec=/usr/lib/zed.app/bin/zed|" \
          /usr/share/applications/dev.zed.Zed.desktop

        # Sanity check.
        test -x /usr/lib/zed.app/bin/zed
        test -L /usr/bin/zed
        test -f /usr/share/applications/dev.zed.Zed.desktop

  # ─── Image signing (cosign) ──────────────────────────────────────────
  - type: signing
