---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: bluefin-gdx-workstation
description: >-
  Custom Bluefin GDX LTS for an HPO/ML workstation.
  Adds 1Password, Brave, Insync (GUI + Nautilus), and Zed.
  Disables zram, applies HPO sysctl/THP tunings, sets nvidia-drm.modeset=0
  for AMD-primary + Nvidia-compute-only multi-GPU config.

base-image: ghcr.io/ublue-os/bluefin-gdx
image-version: lts

modules:
  # ─── System config files ─────────────────────────────────────────────
  # zram-generator override (empty file), sysctl tunings, THP tmpfiles.d,
  # systemd user units (insync, protonmail-bridge, local AI), ujust
  # recipes, GNOME gschema override (disable auto-suspend), tailscaled
  # network-online drop-in.
  - type: files
    files:
      - source: system
        destination: /

  # ─── Recompile GNOME gschemas (pick up the auto-suspend override) ────
  # files/system/usr/share/glib-2.0/schemas/zz1-bluefin-gdx-no-autosuspend
  # .gschema.override changes the default sleep-inactive-ac-type to
  # 'nothing' (no auto-suspend — s2idle resume hangs on this AMD box).
  # A .override is inert until the schema dir is recompiled into
  # gschemas.compiled. Must run AFTER the `files` module stages it.
  - type: script
    snippets:
      - |
        set -euo pipefail
        override=/usr/share/glib-2.0/schemas/zz1-bluefin-gdx-no-autosuspend.gschema.override
        test -f "$override" || { echo "ERROR: $override not staged — files module didn't run or path changed"; exit 1; }
        glib-compile-schemas /usr/share/glib-2.0/schemas/
        # Assert the new default actually took. GSETTINGS_BACKEND=memory
        # makes gsettings read the compiled schema default without needing
        # a D-Bus session / dconf (neither exists in the build container);
        # it returns the schema default, which after the override is
        # 'nothing'. Fails the build loudly if the override didn't apply.
        val=$(GSETTINGS_BACKEND=memory GSETTINGS_SCHEMA_DIR=/usr/share/glib-2.0/schemas \
          gsettings get org.gnome.settings-daemon.plugins.power sleep-inactive-ac-type)
        echo "Compiled default sleep-inactive-ac-type=$val"
        test "$val" = "'nothing'" || { echo "ERROR: override didn't take, got [$val]"; exit 1; }

  # ─── Kernel cmdline: disable DRM modeset on Nvidia GPUs ──────────────
  # Required for AMD-primary-display + Nvidia-compute-only setup.
  # Prevents Mutter from scheduling work on the 4090s and doing
  # expensive cross-GPU framebuffer copies. CUDA is unaffected
  # (CUDA uses /dev/nvidia* char devices, not DRM).
  #
  # Why this is a `script` module, not a `kargs` module:
  # the Bluefin GDX base image ships /usr/lib/bootc/kargs.d/00-nvidia.toml
  # with `nvidia-drm.modeset=1` (uBlue's standard Nvidia-display config,
  # required for Wayland-on-Nvidia setups). A separate kargs.d file
  # setting `=0` does NOT override it — bootc upstream documents
  # cross-file karg removal/override as "currently undefined behavior"
  # and empirically the base's `=1` wins on /proc/cmdline. The reliable
  # fix is to edit the base's file in place; the BlueBuild `files`
  # module's cp -rf would also work, but `sed -i` survives upstream
  # adding new kargs to that file.
  #
  # Fail loudly if the base ever changes the karg name or value — better
  # to break the build than silently boot with the wrong cmdline.
  - type: script
    snippets:
      - |
        set -euo pipefail
        karg_file=/usr/lib/bootc/kargs.d/00-nvidia.toml
        test -f "$karg_file" || { echo "ERROR: $karg_file missing — Bluefin GDX base layout changed, recipe needs update"; exit 1; }
        grep -q 'nvidia-drm.modeset=1' "$karg_file" || { echo "ERROR: $karg_file no longer contains 'nvidia-drm.modeset=1' — base changed, recipe needs update"; cat "$karg_file"; exit 1; }
        sed -i 's/nvidia-drm.modeset=1/nvidia-drm.modeset=0/g' "$karg_file"
        grep -q 'nvidia-drm.modeset=0' "$karg_file"
        ! grep -q 'nvidia-drm.modeset=1' "$karg_file"
        echo "Patched $karg_file:"
        cat "$karg_file"

  # ─── Make the Nvidia 4090s COMPUTE-ONLY (no graphics DRM stack) ───────
  # `nvidia-drm.modeset=0` above is necessary but NOT sufficient. The base
  # still loads nvidia_drm + nvidia_modeset, which register the 4090s as DRM
  # graphics devices (/dev/dri/cardN, /dev/nvidia-modeset). GNOME/Mutter and
  # Electron apps then enumerate and hold those open via EGL/GLX/Vulkan — which
  # (a) wastes the compute GPUs on the desktop and (b) makes runtime VFIO
  # passthrough WEDGE THE KERNEL: the open handles block libvirt's managed
  # detach ("NVRM: ... non-zero usage count"), forcing a reboot.
  #
  # Fix: keep the graphics modules unloaded so the desktop physically cannot
  # touch the cards. CUDA needs only `nvidia` + `nvidia_uvm`, which still load.
  #   1. modprobe.d blacklist + install-override — shipped via the files module
  #      at /usr/lib/modprobe.d/nvidia-compute-only.conf (stops post-boot load).
  #   2. strip ALL nvidia modules from the base dracut force_drivers, then
  #      regenerate the initramfs (last module) so they aren't force-loaded early.
  #   3. disable the Nvidia Vulkan ICD so Vulkan apps don't enumerate the cards
  #      either (EGL/GLX are already dead once nvidia_modeset is gone).
  #
  # VERIFY after rebase: `lsmod | grep -E 'nvidia_drm|nvidia_modeset'` is empty,
  # `ls /sys/bus/pci/devices/0000:02:00.0/drm/` is empty, and CUDA still runs
  # (nvidia + nvidia_uvm load on demand; nvidia-smi shows both cards).
  - type: script
    snippets:
      - |
        set -euo pipefail

        # (1) shipped via the files module — assert it landed.
        bl=/usr/lib/modprobe.d/nvidia-compute-only.conf
        test -f "$bl" || { echo "ERROR: $bl not staged — files module didn't run or path changed"; exit 1; }

        # (2) Strip ALL nvidia modules from the base's dracut force_drivers.
        # The display is the AMD W7500, so nvidia is never needed in the ramdisk.
        # Removing it (a) keeps nvidia_drm/nvidia_modeset out so the desktop can't
        # grab the 4090s, and (b) shrinks the initramfs massively — the huge open
        # nvidia.ko + GSP firmware drop out. That size cut is essential: /boot is
        # only ~769 MB, and a regenerated (custom-checksum) initramfs needs its
        # own /boot copy, so it must be small enough for two to coexist. CUDA is
        # unaffected — nvidia + nvidia_uvm load post-boot via nvidia-modprobe when
        # a GPU job starts.
        f=/usr/lib/dracut/dracut.conf.d/99-nvidia.conf
        test -f "$f" || { echo "ERROR: $f missing — base Nvidia layout changed, recipe needs update"; exit 1; }
        grep -q 'force_drivers' "$f" || { echo "ERROR: no force_drivers in $f"; cat "$f"; exit 1; }
        grep -qE '\bnvidia' "$f" || { echo "ERROR: $f no longer force-loads any nvidia module — base changed, re-check this recipe"; cat "$f"; exit 1; }
        sed -i -E 's/\bnvidia(_[a-z]+)?\b//g; s/  +/ /g' "$f"
        ! grep -qE '\bnvidia' "$f" || { echo "ERROR: failed to strip nvidia from $f"; cat "$f"; exit 1; }
        grep -qw i915 "$f" && grep -qw amdgpu "$f" || { echo "ERROR: trim removed too much (i915/amdgpu gone) from $f"; cat "$f"; exit 1; }
        echo "Trimmed dracut force_drivers -> $(cat "$f")"

        # (3) disable the Nvidia Vulkan ICD (CUDA does not use Vulkan).
        shopt -s nullglob
        for icd in /usr/share/vulkan/icd.d/nvidia_icd*.json; do
          mv "$icd" "${icd}.disabled"
          echo "Disabled Vulkan ICD: $icd -> ${icd}.disabled"
        done

  # ─── Third-party RPMs in a single dnf transaction ────────────────────
  # CS10 ships dnf4, not dnf5 — the BlueBuild `dnf` module will not work
  # on this base. Using the `script` module with `dnf install` instead.
  - type: script
    snippets:
      - |
        set -euo pipefail

        # --- 1Password ---
        rpm --import https://downloads.1password.com/linux/keys/1password.asc
        cat > /etc/yum.repos.d/1password.repo << 'EOF'
        [1password]
        name=1Password Stable Channel
        baseurl=https://downloads.1password.com/linux/rpm/stable/$basearch
        enabled=1
        gpgcheck=1
        repo_gpgcheck=1
        gpgkey=https://downloads.1password.com/linux/keys/1password.asc
        EOF

        # --- Brave (key file is brave-core.asc, not brave-browser.asc) ---
        rpm --import https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
        cat > /etc/yum.repos.d/brave-browser.repo << 'EOF'
        [brave-browser]
        name=Brave Browser
        enabled=1
        gpgcheck=1
        gpgkey=https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
        baseurl=https://brave-browser-rpm-release.s3.brave.com/$basearch
        EOF

        # --- Insync (native EL10 repo, confirmed available 2026-05) ---
        # Install GUI + nautilus. The sync engine is started in the
        # background by a systemd --user unit (see
        # files/system/usr/lib/systemd/user/insync.service) so the GUI
        # is only opened when the user wants to configure or browse.
        rpm --import https://d2t3ff60b2tol4.cloudfront.net/repomd.xml.key
        cat > /etc/yum.repos.d/insync.repo << 'EOF'
        [insync]
        name=insync repo
        baseurl=https://yum.insync.io/centos/10/
        gpgcheck=1
        gpgkey=https://d2t3ff60b2tol4.cloudfront.net/repomd.xml.key
        enabled=1
        EOF

        # --- Tailscale (official CS10 repo, mesh VPN) ---
        # `tailscaled` is a SYSTEM service (needs CAP_NET_ADMIN to
        # manage the WireGuard interface), not a user service like
        # Insync. Enabled via the `systemd` module below, NOT via the
        # RPM's %systemd_post preset (BlueBuild's systemd module is
        # the consistent enable mechanism in this recipe).
        # First-run still requires `sudo tailscale up` once to
        # authenticate with the tailnet — same one-time-setup pattern
        # as Insync's first GUI sign-in.
        rpm --import https://pkgs.tailscale.com/stable/centos/10/repo.gpg
        cat > /etc/yum.repos.d/tailscale.repo << 'EOF'
        [tailscale-stable]
        name=Tailscale stable
        baseurl=https://pkgs.tailscale.com/stable/centos/10/$basearch
        enabled=1
        type=rpm
        repo_gpgcheck=1
        gpgcheck=1
        gpgkey=https://pkgs.tailscale.com/stable/centos/10/repo.gpg
        EOF

        # Single dnf transaction (faster than multiple).
        # gnome-browser-connector (CS10 AppStream) provides the native
        # messaging host so extensions.gnome.org "Install" buttons work
        # in Firefox/Chrome/Brave without manual rpm-ostree layering.
        dnf install -y \
          1password 1password-cli \
          brave-browser \
          insync insync-nautilus \
          tailscale \
          gnome-browser-connector

        dnf clean all
        rm -rf /var/cache/dnf /var/cache/yum

  # ─── Proton Mail Bridge (native RPM from proton.me) ──────────────────
  # Proton publishes a Fedora-targeted RPM but no Fedora repo and no
  # "latest" URL — only versioned URLs. So we pin the version here and
  # bump it on each Bridge release. The image's daily CI rebuild does
  # NOT auto-pick up new Bridge versions; that's a deliberate trade-off
  # of using the native RPM over the Flathub Flatpak.
  #
  # Why native RPM over Flathub Flatpak (ch.protonmail.protonmail-bridge):
  # the Flatpak is community-maintained (not Proton-verified) and has
  # structural keyring issues — Bridge wants org.freedesktop.secrets
  # directly; the sandbox forces it through xdg-desktop-portal's Secret
  # portal, which intermittently drops out and breaks Thunderbird's IMAP
  # to localhost:1143 until the user re-auths
  # (flathub/ch.protonmail.protonmail-bridge #145, #136). Proton's own
  # Linux setup guide only documents the native install path.
  #
  # Autostart is handled by a systemd --user unit at
  # files/system/usr/lib/systemd/user/protonmail-bridge.service. Enable
  # it post-rebase via `ujust enable-protonmail-bridge`.
  - type: script
    snippets:
      - |
        set -euo pipefail
        BRIDGE_VER="3.24.2-1"
        BRIDGE_URL="https://proton.me/download/bridge/protonmail-bridge-${BRIDGE_VER}.x86_64.rpm"
        TMP_RPM="$(mktemp /tmp/protonmail-bridge-XXXXXX.rpm)"
        trap 'rm -f "$TMP_RPM"' EXIT

        echo "Downloading Proton Mail Bridge ${BRIDGE_VER}..."
        curl -fsSL "$BRIDGE_URL" -o "$TMP_RPM"

        # `dnf install` on a local RPM resolves dependencies from the
        # configured repos (CS10 AppStream/BaseOS has Qt6, libsecret,
        # etc. that Bridge links against).
        dnf install -y "$TMP_RPM"

        # Sanity check.
        test -x /usr/bin/protonmail-bridge

        dnf clean all
        rm -rf /var/cache/dnf /var/cache/yum

  # ─── Thermal / IPMI: CoolerControl daemon ────────────────────────────
  # CoolerControl has no native ipmitool support
  # (gitlab.com/coolercontrol/coolercontrol issue #540), so the IPMI ↔
  # CoolerControl bridge on this ASRock WRX80 Creator R2.0 uses the
  # official `cc-plugin-custom-device` plugin (declared per-channel via
  # ipmitool commands in manifest.toml with `privileged = true`).
  #
  # The plugin is NOT installed at build time — it ships via the
  # `ujust install-cc-plugin` recipe in 60-custom.just instead. Why:
  # coolercontrold 4.x migrates /etc/coolercontrol/plugins → symlink to
  # /var/lib/coolercontrol/plugins on first start. A build-time install
  # bakes the path as a directory, then the daemon converts it to a
  # symlink, and every subsequent ostree /etc merge fails with
  # "Modified config file newly defaults to directory 'coolercontrol/
  # plugins', cannot merge" (an unrecoverable shape conflict).
  # Installing post-rebase via ujust keeps the image's /etc free of
  # this path so ostree never has to reconcile it.
  #
  # coolercontrold's web UI is on http://localhost:11987 — the Qt
  # `coolercontrol` desktop wrapper is intentionally NOT installed.
  - type: script
    snippets:
      - |
        set -euo pipefail

        # CoolerControl COPR (codifryed/CoolerControl). The COPR builds
        # for epel-10-x86_64; the .repo file is self-contained and does
        # not require EPEL itself to be enabled.
        curl -fsSL \
          https://copr.fedorainfracloud.org/coprs/codifryed/CoolerControl/repo/epel-10/codifryed-CoolerControl-epel-10.repo \
          -o /etc/yum.repos.d/codifryed-CoolerControl-epel-10.repo

        # ipmitool + lm_sensors + sudo from centos-appstream;
        # coolercontrold from the COPR.
        #
        # --setopt=install_weak_deps=False skips the python3-liquidctl
        # Recommend (would need EPEL; we have no liquid cooling). We add
        # lm_sensors explicitly because it IS wanted (CoolerControl uses
        # it for hwmon sensor discovery) and we don't want to rely on
        # weak-dep resolution to pull it. sudo is needed by the ujust
        # `install-cc-plugin` recipe (the upstream install.sh uses it).
        dnf install -y --setopt=install_weak_deps=False \
          ipmitool \
          lm_sensors \
          sudo \
          coolercontrold

        dnf clean all
        rm -rf /var/cache/dnf /var/cache/yum

  # ─── Enable build-time services ──────────────────────────────────────
  # - coolercontrold.service: COPR ships the unit but doesn't preset-
  #   enable it, so without this the web UI on :11987 is not reachable
  #   after a fresh rebase. Must come AFTER the CoolerControl install
  #   module so the unit file exists when `systemctl enable` runs.
  # - amdgpu-pin-mclk.service: workstation-specific oneshot that pins
  #   MCLK to its highest DPM state on the AMD GPU at boot — fixes the
  #   Navi 33 / 5120x1440 ultrawide high-refresh blanking. The unit
  #   file is shipped via files/system/etc/systemd/system/.
  # - coolercontrol-bmc-bridge.service: companion oneshot that switches
  #   FAN1-5 to BMC manual mode before coolercontrold starts, and back
  #   to default mode when it stops. Enables CoolerControl to drive the
  #   ASRock Rack BMC's fan PWMs via the cc-set-fan-duty.sh wrapper.
  #   BindsTo=coolercontrold.service + WantedBy=coolercontrold.service:
  #   pulled in whenever cc starts, stops when cc stops — no need to
  #   modify the upstream coolercontrold.service file.
  - type: systemd
    system:
      enabled:
        - coolercontrold.service
        - amdgpu-pin-mclk.service
        - coolercontrol-bmc-bridge.service
        - tailscaled.service

  # ─── Profiling tools (kernel-coupled, must match running kernel) ─────
  # perf and bpftrace are built from the kernel source tree and read
  # kernel data structures whose ABI changes between versions; running
  # them inside a Distrobox produces cryptic errors, miscounted events,
  # or unresolved symbols because the container ships them built for a
  # different kernel. Same logic for ftrace consumers and anything
  # reading /sys/kernel/debug.
  #
  # Userland Python profilers (py-spy, scalene, austin, memray,
  # line_profiler, pyinstrument) read process memory rather than kernel
  # counters and are intentionally NOT installed here — those go in the
  # user's conda env via pip/uv.
  #
  # `kernel.perf_event_paranoid = 1` is set via the sysctl tunings, so
  # the user can run `perf stat` / `perf record` against own processes
  # without sudo.
  - type: script
    snippets:
      - |
        set -euo pipefail

        # All from CS10 AppStream/BaseOS — no third-party repos needed.
        dnf install -y \
          perf \
          bpftrace \
          sysstat \
          strace \
          ltrace \
          numactl \
          hwloc

        dnf clean all
        rm -rf /var/cache/dnf /var/cache/yum

  # ─── Zed editor (official upstream tarball) ──────────────────────────
  # Installed to /usr/lib/zed.app (part of the OS image, read-only at
  # runtime, updated only via image rebuilds). System-wide binary
  # symlink at /usr/bin/zed and system-wide .desktop entry.
  - type: script
    snippets:
      - |
        set -euo pipefail

        # zed.dev/api/.../latest/zed-linux-x86_64.tar.gz 307-redirects to
        # the corresponding github.com/zed-industries/zed release asset.
        # curl -L follows redirects, so this resolves to the current
        # stable build on each image rebuild.
        ZED_URL="https://zed.dev/api/releases/stable/latest/zed-linux-x86_64.tar.gz"
        TMP_TARBALL="$(mktemp /tmp/zed-XXXXXX.tar.gz)"
        trap 'rm -f "$TMP_TARBALL"' EXIT

        echo "Downloading latest stable Zed..."
        curl -fsSL "$ZED_URL" -o "$TMP_TARBALL"

        # The tarball expands to ./zed.app/ — extract directly into /usr/lib.
        mkdir -p /usr/lib
        tar -xzf "$TMP_TARBALL" -C /usr/lib/

        # System-wide terminal symlink. Zed 0.139+ consolidated the
        # separate bin/cli into bin/zed (one binary handles both the
        # terminal CLI shim and the GUI launcher). The official
        # install.sh has the same `if bin/cli exists else bin/zed`
        # fallback chain; we hard-code the new path since the LTS image
        # rebuilds against current stable.
        ln -sf /usr/lib/zed.app/bin/zed /usr/bin/zed

        # System-wide .desktop entry with absolute paths.
        # Newer tarballs ship dev.zed.Zed.desktop; older ones ship zed.desktop.
        # The official install.sh has this same fallback.
        src_desktop="/usr/lib/zed.app/share/applications/dev.zed.Zed.desktop"
        [ -f "$src_desktop" ] || src_desktop="/usr/lib/zed.app/share/applications/zed.desktop"
        install -Dm644 "$src_desktop" /usr/share/applications/dev.zed.Zed.desktop
        sed -i \
          -e "s|Icon=zed|Icon=/usr/lib/zed.app/share/icons/hicolor/512x512/apps/zed.png|" \
          -e "s|Exec=zed|Exec=/usr/lib/zed.app/bin/zed|" \
          /usr/share/applications/dev.zed.Zed.desktop

        # Sanity check.
        test -x /usr/lib/zed.app/bin/zed
        test -L /usr/bin/zed
        test -f /usr/share/applications/dev.zed.Zed.desktop

  # ─── Virtualization GUI + GPU-passthrough VM host bits ───────────────
  # The full KVM stack (libvirt, qemu-kvm, virtiofsd, swtpm, edk2-ovmf) is
  # ALREADY in the bluefin-gdx base and `virtqemud` is pre-enabled — we do
  # NOT re-install any of it. Two gaps are filled here:
  #   1. virt-manager (the GTK GUI). The base ships only virt-manager-common
  #      (backend data), not the window. Layered as an RPM rather than the
  #      Flatpak so it talks to the system libvirt socket without the
  #      Flatpak's /run/libvirt access workaround. From CS10 AppStream.
  #      (SPICE was removed in EL10, so the VM console is VNC — see the
  #      win11-trading.xml template shipped below.)
  #   2. The libvirt qemu hook staged at /etc/libvirt/hooks/qemu (via the
  #      `files` module) must be executable, or libvirt silently won't run
  #      it. chmod + assert here.
  #
  # The Win11 trading VM itself (one RTX 4090 passed through + Sunshine) is
  # finished post-rebase via `ujust setup-vm-host`: it adds you to the libvirt
  # group, installs the Moonlight client, activates the default NAT network,
  # and DISCOVERS your user/uid + the target GPU + its pinned local-AI service
  # into /etc/bluefin-gdx/vm-passthrough.conf (which the hook reads — so no
  # username or GPU id is baked into the image). The kvm.ignore_msrs
  # Windows-stability karg ships as a kargs.d drop-in at
  # files/system/usr/lib/bootc/kargs.d/10-vm-windows.toml.
  - type: script
    snippets:
      - |
        set -euo pipefail

        # virt-manager GUI (CS10 AppStream — base already pulled in its deps
        # via virt-manager-common, so this is a small add).
        dnf install -y virt-manager
        dnf clean all
        rm -rf /var/cache/dnf /var/cache/yum

        # The qemu hook is staged read-only by the `files` module (which runs
        # first); libvirt only executes hooks that are +x. Fail loudly if the
        # path ever moves so we don't silently ship a dead hook.
        hook=/etc/libvirt/hooks/qemu
        test -f "$hook" || { echo "ERROR: $hook not staged — files module didn't run or path changed"; exit 1; }
        chmod 0755 "$hook"
        test -x "$hook"
        echo "qemu hook present and executable: $hook"

  # ─── Regenerate the initramfs (bake compute-only into the ramdisk) ───
  # MUST be last (before signing) so it captures every prior change.
  #
  # The compute-only module strips ALL nvidia modules from the dracut
  # force_drivers and blacklists nvidia_drm/nvidia_modeset — but the BASE image's
  # prebuilt initramfs still force-loads them, so on first boot they come up
  # BEFORE the real-root modprobe.d blacklist can take effect (confirmed: `lsmod`
  # showed them loaded, gnome-shell holding /dev/nvidia-modeset). The only fix is
  # to rebuild the ramdisk so the strip is baked in.
  #
  # This MUST happen at build time:
  #   - Bluefin sets LockLayering=true, so client `rpm-ostree initramfs --enable`
  #     is refused ("Cannot operate; LockLayering=true").
  #   - BlueBuild's own `initramfs` module refuses on this CS10 base (its guard
  #     is `OS_VERSION <= 40`; VERSION_ID here is 10).
  # So we run dracut directly with the SAME incantation that module uses
  # (--add ostree --no-hostonly --reproducible), plus an explicit --omit-drivers
  # and build-time asserts.
  #
  # /boot is tiny (~769 MB) and a custom-checksum initramfs can't share /boot
  # with the base, so it must be SMALL — that's why all nvidia (the giant
  # nvidia.ko + GSP firmware) is omitted, not just drm/modeset. The build prints
  # the resulting size; it needs to be well under ~370 MB so two can coexist in
  # /boot during a rebase. CUDA is untouched (nvidia + nvidia_uvm load post-boot).
  - type: script
    snippets:
      - |
        set -euo pipefail
        # Resolve the (single) installed kernel by its vmlinuz.
        kver=""
        for d in /usr/lib/modules/*/; do
          [ -f "${d}vmlinuz" ] && kver="$(basename "$d")"
        done
        test -n "$kver" || { echo "ERROR: no kernel with vmlinuz under /usr/lib/modules"; ls -la /usr/lib/modules; exit 1; }
        img="/usr/lib/modules/${kver}/initramfs.img"
        echo "Regenerating initramfs for kernel ${kver} -> ${img}"

        # Same flags as BlueBuild's initramfs module (ostree boot module is
        # REQUIRED or the system won't boot); omit ALL nvidia modules ('nvidia'
        # as a substring pattern matches nvidia, nvidia_drm, nvidia_modeset,
        # nvidia_uvm, nvidia_peermem).
        dracut --kver "$kver" --force --add 'ostree' --no-hostonly --reproducible \
          --omit-drivers 'nvidia' "$img"
        chmod 0600 "$img"

        # Report the size — this is the number that has to fit in /boot.
        echo "Regenerated initramfs size: $(du -h "$img" | cut -f1)"

        # Fail the build loudly if any nvidia kernel module slipped back in.
        if command -v lsinitrd >/dev/null 2>&1; then
          if lsinitrd "$img" 2>/dev/null | grep -Eiq 'nvidia[a-z_]*\.ko'; then
            echo "ERROR: an nvidia module is still present in the regenerated initramfs:"
            lsinitrd "$img" 2>/dev/null | grep -Ei 'nvidia[a-z_]*\.ko'
            exit 1
          fi
          echo "Verified: no nvidia kernel modules in the regenerated initramfs"
        fi

  # ─── Image signing (cosign) ──────────────────────────────────────────
  - type: signing
