# Transparent Huge Pages: madvise mode.
# - `always` causes kcompactd defragmentation stalls under memory pressure
# - `never` disables a useful optimisation for libraries that request THP
# - `madvise` lets jemalloc, glibc malloc, PyTorch CUDA pinned memory etc.
#   opt in via madvise(MADV_HUGEPAGE) without forcing THP on everything.
w! /sys/kernel/mm/transparent_hugepage/enabled - - - - madvise
w! /sys/kernel/mm/transparent_hugepage/defrag  - - - - madvise
