# The ASRock WRX80 Creator R2.0's BMC exposes a virtual USB ethernet
# device (USB ID 046b:ffb0, "American Megatrends, Inc. Virtual
# Ethernet") alongside its virtual KVM/keyboard/mouse interfaces. It
# enumerates as `usb0` with the cdc_ether driver.
#
# We don't route normal connectivity through this device, but NM's
# default auto-activation keeps trying to bring it up on a ~45-second
# loop (prepare → failed → disconnected → prepare), and each failure
# fires a "network disconnected" GNOME notification.
#
# Marking the interface unmanaged stops the loop. If you ever need the
# BMC's USB tunneling (e.g. for IPMI KVM-over-USB), run
# `nmcli device set usb0 managed yes` in that session.
[keyfile]
unmanaged-devices=interface-name:usb0
