# HPO/ML workstation tunings for Bluefin LTS NVIDIA.
# Applied at boot by systemd-sysctl.service.

# Scheduler — preserve desktop responsiveness under mixed interactive and
# CPU-bound workloads by grouping tasks according to their controlling TTY.
kernel.sched_autogroup_enabled = 1

# NUMA balancing kept enabled — workloads are NOT pinned with numactl/taskset.
# (Flip to 0 ONLY if pinning practice changes.)
kernel.numa_balancing = 1

# Memory management
# Disable zone reclaim — modern default, set explicitly as a safety net.
vm.zone_reclaim_mode = 0
# Always allow overcommit — required for Python multiprocessing.fork()
# patterns when parent RSS is large. With no swap, OOM killer still
# enforces real limits.
vm.overcommit_memory = 1
# Raise mmap limit — Electron apps, Java, some PyTorch ops hit the
# 65530 default. 2147483642 is the standard Steam/gaming value.
vm.max_map_count = 2147483642

# Dirty page limits — critical on 512GB RAM.
# Default ratios (10%/3%) translate to ~51GB/15GB of dirty pages, which
# causes multi-minute fsync stalls during checkpoint writes.
# Absolute byte limits cap this at 4GB / 1GB.
vm.dirty_bytes = 4294967296
vm.dirty_background_bytes = 1073741824

# Allow non-root profiling tools (py-spy, perf, bpftrace consumers).
kernel.perf_event_paranoid = 1
