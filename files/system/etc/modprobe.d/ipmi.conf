# Hard-code the BMC's KCS interface port for ipmi_si.
#
# Why: on the ASRock Rack WRX80 Creator R2.0, the BIOS sometimes POSTs
# before the BMC is ready to be queried, in which case DMI Type 38
# (the "IPMI Device Information" structure the kernel uses to
# auto-discover the BMC) ends up empty. The ipmi_si driver then fails
# to find any System Interface and `/dev/ipmi0` never appears. The
# race is much more likely after a cold start (AC power-cycle) than
# after a warm reboot.
#
# Confirmed empirically (2026-05-28) that the KCS interface on this
# board sits at I/O port 0xca2 — modprobing `ipmi_si type=kcs
# ports=0xca2` finds the BMC every time. Hard-coding it here means
# we never depend on DMI auto-discovery again.
#
# If the board is ever swapped for a different ASRock Rack model with
# a different KCS port, update this file. Discover the port with:
#   sudo modprobe -r ipmi_si
#   sudo modprobe ipmi_si type=kcs ports=0xca2  # try standard ports
#   sudo modprobe ipmi_si type=kcs ports=0xca8
#   sudo modprobe ipmi_si type=kcs ports=0xca0
# Whichever produces a "Found new BMC" line in dmesg is the right one.
options ipmi_si type=kcs ports=0xca2
