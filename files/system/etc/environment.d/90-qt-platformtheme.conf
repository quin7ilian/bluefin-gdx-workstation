# Make Qt5 apps inherit GTK3 settings (including dark mode) on this GNOME
# session. Qt loads $QT_QPA_PLATFORMTHEME from its platformthemes plugin
# directory at startup. `gtk3` resolves to libqgtk3.so, which bridges Qt
# styling/colours/fonts/icons through the system GTK3 theme.
#
# Caveat: only Qt apps that have access to libqgtk3 benefit. Insync ships
# its own copy at /usr/lib/insync/PySide2/Qt/plugins/platformthemes/
# libqgtk3.so, so this works out of the box. If you add other Qt apps to
# the image later and they DON'T bundle libqgtk3, they'll log a warning
# at startup ("Cannot find platform theme 'gtk3'") and fall back to the
# default Fusion style — annoying but not fatal. The Fedora-style fix
# would be to install adwaita-qt5/qgnomeplatform, but CS10 doesn't ship
# either package in BaseOS/AppStream/CRB/EPEL.
#
# Pair with /etc/gtk-3.0/settings.ini (gtk-application-prefer-dark-theme).
QT_QPA_PLATFORMTHEME=gtk3
