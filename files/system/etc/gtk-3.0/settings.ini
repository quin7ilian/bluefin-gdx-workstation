[Settings]
# Modern GNOME (42+) ships Adwaita as a libadwaita-only theme that adapts
# to org.gnome.desktop.interface color-scheme. There is NO Adwaita-dark
# theme directory on disk anymore — only the GTK3 compiled-in fallback,
# which defaults to LIGHT. Apps that don't use libadwaita (Electron via
# libdecor-gtk, Insync via Qt5 libqgtk3, any legacy GTK3 app) therefore
# stay light even when GNOME's color-scheme is `prefer-dark`.
#
# `gtk-application-prefer-dark-theme = true` flips compiled-in Adwaita
# to its dark variant for every GTK3 app that reads this file. Combined
# with QT_QPA_PLATFORMTHEME=gtk3 (set in /etc/environment.d/), this also
# makes Qt5 apps that ship libqgtk3 inherit the dark preference.
#
# Trade-off: this is hard-coded, not adaptive. Flipping GNOME back to
# light mode via Settings → Appearance only affects libadwaita apps —
# 1Password/Insync/etc. stay dark. Acceptable on a workstation that
# lives in dark mode permanently. Remove this file (and the env.d entry)
# if you want light mode for everything.
gtk-application-prefer-dark-theme = true
