# Order tailscaled after the network is actually online.
#
# Stock tailscaled.service only declares `After=network-pre.target`, so on
# a cold boot it starts BEFORE the NIC has a carrier/IP. On this box the
# daemon came up at 09:51:16 but enp212s0 didn't get its DHCP lease until
# 09:51:25 — tailscaled spent that window failing bootstrap DNS ("network
# is unreachable") and churning through registration attempts. The control
# client could land in a half-broken session state that never cleanly
# recovered, which manifested as the interactive login long-poll dying with
# `register request: http 410: auth path not found` ~8s after each
# `tailscale up`, even though netcheck/IPv4 connectivity were healthy.
#
# Waiting for network-online.target (backed by NetworkManager-wait-online,
# enabled by default on the Bluefin base) means the daemon initialises
# against a working network and registers cleanly on first try.
#
# This is a drop-in: the upstream unit is left untouched, so a Tailscale
# package update that changes the unit won't clobber this and this won't
# clobber upstream improvements.
[Unit]
Wants=network-online.target
After=network-online.target
