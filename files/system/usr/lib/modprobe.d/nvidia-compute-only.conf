# Make the Nvidia 4090s COMPUTE-ONLY: do NOT load the graphics DRM stack.
#
# This workstation drives its display from the AMD W7500; the 4090s exist for
# CUDA (and optional VFIO passthrough to a VM). Loading nvidia_drm +
# nvidia_modeset registers the cards as DRM/KMS graphics devices
# (/dev/dri/cardN, /dev/nvidia-modeset) which GNOME/Mutter and Electron apps
# then enumerate and hold open via EGL/GLX/Vulkan. That:
#   - wastes the compute GPUs on desktop graphics, and
#   - makes runtime VFIO passthrough impossible — the open handles block
#     libvirt's managed detach and WEDGE THE KERNEL
#     ("NVRM: Attempting to remove device ... with non-zero usage count!"),
#     which forces a hard reboot.
#
# `nvidia-drm.modeset=0` does NOT prevent any of this (it only stops nvidia from
# driving a *display*; the DRM devices are still registered). Keeping the two
# graphics modules unloaded is what actually makes the cards compute-only.
# CUDA needs only `nvidia` + `nvidia_uvm`, which still load normally.
#
# `install ... /usr/bin/true` is belt-and-suspenders over `blacklist`: it stops
# the modules loading even if something tries to modprobe them explicitly
# (e.g. a dependency pull or a stale dracut force_drivers entry).
blacklist nvidia_drm
blacklist nvidia_modeset
install nvidia_drm /usr/bin/true
install nvidia_modeset /usr/bin/true
