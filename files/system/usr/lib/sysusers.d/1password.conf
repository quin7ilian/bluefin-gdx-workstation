# 1Password groups — backstop for the ostree /etc 3-way merge.
#
# The 1Password RPM's after-install.sh runs `groupadd onepassword` and
# `groupadd onepassword-mcp` at build time, which populates
# /usr/etc/group correctly. But at first boot of the deployed image,
# user creation grabs GID 1000 — collision with onepassword-cli (which
# the RPM also created at GID 1000). ostree's /etc 3-way merge then
# silently DROPS the entire 1Password group block on conflict instead
# of just the colliding entry. Result: /usr/etc/group has the groups,
# /etc/group does not, and the 1Password daemon's SO_PEERCRED check
# on incoming browser-bridge IPC fails (`getgrnam("onepassword")` → null
# → connection rejected silently, no SELinux denial, no journal entry).
# Symptom: 1Password browser extension can't connect to the desktop app.
#
# systemd-sysusers reads this file before any user-creation login flow
# and recreates the groups in /etc/group, surviving subsequent ostree
# /etc merges. We deliberately do NOT add onepassword-cli here: its
# build-time GID 1000 would collide with the local user's GID 1000,
# and the CLI works without the SO_PEERCRED hardening (just less
# defended against environmental tampering).
#
# GIDs are pinned to match the build-time chgrp on the binaries:
#   /opt/1Password/1Password-BrowserSupport → setgid GID 1001
#   /opt/1Password/onepassword-mcp          → setgid GID 1002
# If you change them here, the SO_PEERCRED check fails again because
# the binary's setgid GID won't match the daemon's expected GID.

g onepassword     1001 -
g onepassword-mcp 1002 -
