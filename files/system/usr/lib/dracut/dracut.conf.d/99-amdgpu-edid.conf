# Pull the custom G95SD EDID(s) into the initramfs so the drm.edid_firmware karg
# (see /usr/lib/bootc/kargs.d/15-amdgpu-edid.toml) can load them at EARLY KMS —
# amdgpu is force-loaded in the initramfs on this image (kept in dracut
# force_drivers), so the EDID must be present in the ramdisk, not just on /usr.
#
# Both variants shipped so the active karg can be switched (full = blanking + VRR
# fix; vblank = blanking only) with just a karg change + reboot, no rebuild.
# 384 bytes each — negligible initramfs size (the /boot ~769 MB / <370 MB budget
# from the nvidia-strip note is unaffected).
install_items+=" /usr/lib/firmware/edid/g95sd-full.bin /usr/lib/firmware/edid/g95sd-vblank.bin "
