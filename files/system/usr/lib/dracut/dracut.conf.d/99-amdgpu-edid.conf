# Pull the custom G95SD EDID(s) into the initramfs so the drm.edid_firmware karg
# (see /usr/lib/bootc/kargs.d/15-amdgpu-edid.toml) can load them at EARLY KMS —
# amdgpu is force-loaded in the initramfs on this image, so the EDID must be in
# the ramdisk, not just on /usr.
#
# Both refresh variants shipped so the active karg can be switched (216 Hz is the
# default; 200 Hz is the larger-vblank fallback) with just a karg change + reboot,
# no rebuild. 384 bytes each — negligible initramfs size.
install_items+=" /usr/lib/firmware/edid/g95sd-216.bin /usr/lib/firmware/edid/g95sd-200.bin "
