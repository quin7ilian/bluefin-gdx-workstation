# Pull the custom G95SD EDID into the initramfs so the drm.edid_firmware karg
# (see /usr/lib/bootc/kargs.d/15-amdgpu-edid.toml) loads it at EARLY KMS --
# amdgpu is force-loaded in the initramfs on this image, so the EDID must be in
# the ramdisk, not just on /usr. 384 bytes -- negligible initramfs size.
install_items+=" /usr/lib/firmware/edid/g95sd-120.bin "
