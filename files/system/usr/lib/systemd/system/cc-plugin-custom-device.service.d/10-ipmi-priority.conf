# Raise the cc-plugin-custom-device service — and the ipmitool children it
# forks for BMC fan reads/writes — above the default nice 0, so the HPO/ML
# workload that saturates all 128 threads can't starve the userspace side of
# the IPMI command path. Pairs with bmc-ipmi-priority.service, which lifts the
# kernel-side kipmi0 KCS-polling thread (the larger of the two effects).
#
# The plugin unit itself is NOT shipped in this image: it is created at runtime
# by `ujust install-cc-plugin` (upstream install.sh) under /etc/systemd/system.
# systemd merges drop-ins from /usr/lib, /run and /etc, so this /usr/lib drop-in
# applies to that /etc unit. If the plugin is never installed, the drop-in is
# simply inert.
[Service]
Nice=-5
