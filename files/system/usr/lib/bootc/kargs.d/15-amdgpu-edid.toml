# Custom EDID + DSC-off karg for the Samsung Odyssey G95SD (OLED G9, 5120x1440, DP 1.4).
#
# Runs the panel at 5120x1440@120 with a LARGE (~1060us, 2.3x native) vertical blank,
# uncompressed (no DSC), to eliminate the cursor-triggered screen blanking while keeping
# the GPU on `auto` (full clock). Two kargs work together:
#   drm.edid_firmware=DP-1:edid/g95sd-120.bin  -- the big-vblank 120Hz timing
#   amdgpu.dcdebugmask=0x4 (DC_DISABLE_DSC)    -- forces uncompressed / HBR3
#
# Why this shape (all confirmed empirically on this exact panel):
#  - The blank is the amdgpu memory-clock (UCLK) switch failing to hide in the vblank.
#    NOT PSR (sink advertises PSR ver 0).
#  - 240 Hz is IMPOSSIBLE to fix: 5120x1440@240@8bpc = 42.5 Gbps > the W7500's DP 2.1
#    UHBR10 output ceiling (38.8 Gbps), so 240 always needs DSC, and DSC+mclk-switch is
#    what blanks. No cable/adapter raises the GPU's output rate. 240 is off the menu
#    (removed from this EDID).
#  - At 120 Hz the driver was defaulting to an HBR2 link + DSC (dsc_clock_en=1), which
#    blanks. dcdebugmask=0x4 disables DSC -> forces HBR3 (0x1e, which the link verifies) ->
#    120@8bpc (~21 Gbps) fits uncompressed. That cut the blanking but didn't kill it: the
#    mclk switch needs more vblank than native 120 Hz's ~459us. 60 Hz is clean because at
#    half the pixel rate the switch fits its ~461us vblank; 120 Hz needs ~2x. So the EDID
#    stretches the 120 Hz vertical blank to ~1060us (Vtotal 1650), still fitting HBR3
#    uncompressed (25.3 < 25.92 Gbps). Native 120 Hz refresh, just extended blanking
#    (within the panel's VRR envelope, so it accepts the timing).
#
# 8bpc is fine here (no 10bpc/HDR needed on the workstation). Built from the monitor's own
# stock EDID (HDR/colorimetry preserved); the @240 and native-@120 DisplayID timings are
# replaced by the big-vblank @120 (preferred). Validated with edid-decode. .bin ships at
# /usr/lib/firmware/edid/, pulled into the initramfs by .../dracut.conf.d/99-amdgpu-edid.conf.
# Connector is DP-1 (the W7500's card1-DP-1).
#
# If 120 Hz still blanks even with this vblank, DP 1.4's bandwidth caps the vblank right at
# the switch's requirement -> the fix is a DP->HDMI 2.1 adapter (the W7500->HDMI path has
# UHBR10 headroom for a ~3x bigger vblank). See AGENTS.md.
kargs = ["drm.edid_firmware=DP-1:edid/g95sd-120.bin", "amdgpu.dcdebugmask=0x4"]
