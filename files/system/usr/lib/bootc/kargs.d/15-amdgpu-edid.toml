# Custom EDID for the Samsung Odyssey G95SD (OLED G9, 5120x1440, DP 1.4).
#
# Runs the panel at 5120x1440@120 with a LARGE (~1060us, 2.3x native) vertical blank so the
# amdgpu memory-clock (UCLK) switch hides inside the vblank instead of flashing the screen,
# while keeping the GPU on `auto` (full clock). Single karg:
#   drm.edid_firmware=DP-1:edid/g95sd-120.bin  -- the big-vblank 120Hz timing (preferred)
#
# Why this shape (all confirmed empirically on this exact panel):
#  - The blank is the UCLK switch failing to hide in the vblank. NOT PSR (sink PSR ver 0).
#    The ROOT fix is the enlarged vblank: native 120 Hz's ~459us is too short for the switch
#    (60 Hz is clean because at half the pixel rate it fits its ~461us); stretching Vtotal to
#    1650 (~1060us) gives the switch room to complete. The vblank DURATION is set by the mode
#    timing and is independent of DSC, so the switch hides whether DSC is on or off.
#  - DSC is intentionally LEFT ENABLED (no dcdebugmask). With the big vblank the switch hides
#    even with DSC active -- confirmed no-blank across a reboot at both 8bpc (driver runs
#    HBR3 0x1e + light DSC, dsc_clock_en=1) and 10bpc/HDR. Leaving DSC on keeps HDR / 10-bit
#    available on demand (GNOME Settings -> Displays -> HDR); forcing DSC off would block it.
#  - ROLLBACK: if the intermittent blank ever returns, add `amdgpu.dcdebugmask=0x4`
#    (DC_DISABLE_DSC) to force DSC off -> 8bpc uncompressed over HBR3 (~25.3 < 25.92 Gbps).
#    That is the most-proven no-blank config but loses HDR/10-bit (which need DSC's bandwidth).
#  - 240 Hz is IMPOSSIBLE on this GPU: 5120x1440@240@8bpc (~44 Gbps) exceeds the W7500's DP
#    2.1 UHBR10 output ceiling (38.8 Gbps), and the panel is DP 1.4 anyway -- so 240 always
#    needs DSC and always hits the switch in a tiny vblank. No DP->HDMI adapter helps: every
#    shipping active adapter has a DP 1.4 / HBR3 input (Synaptics VMM7100 / Realtek RTD2173),
#    so it bottlenecks to 25.92 Gbps, same as the monitor's own DP port. The only real 240
#    paths are a native-HDMI-2.1 GPU (e.g. a single-slot Intel Arc Pro B50 -- but Battlemage
#    has an unresolved half-refresh-on-Wayland bug, so NOT recommended yet) or a monitor with
#    a native DP 2.1 UHBR13.5+ input. See AGENTS.md.
#
# Built from the monitor's own stock EDID (10bpc + HDR/colorimetry preserved -- verified); the
# @240 and native-@120 DisplayID timings are replaced by the big-vblank @120 (preferred).
# Validated with edid-decode. .bin ships at /usr/lib/firmware/edid/, pulled into the initramfs
# by .../dracut.conf.d/99-amdgpu-edid.conf. Connector is DP-1 (the W7500's card1-DP-1).
kargs = ["drm.edid_firmware=DP-1:edid/g95sd-120.bin"]
