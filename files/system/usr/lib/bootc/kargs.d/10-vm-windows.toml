# Windows-guest KVM stability. Some Windows guests probe MSRs that QEMU does
# not emulate and crash on the resulting #GP fault; kvm.ignore_msrs=1 makes the
# kernel return 0 for unknown MSR reads/writes instead of faulting, and
# kvm.report_ignored_msrs=0 silences the per-access dmesg warnings. Mirrors
# Bazzite's `ujust setup-virtualization` default. It is a global KVM setting
# (applies to every guest) but is inert for the host and for Linux guests.
#
# This is a NEW karg in its own file — supported by bootc's kargs.d aggregation.
# (Contrast the nvidia-drm.modeset override in recipe.yml, which had to edit the
# base's 00-nvidia.toml in place because cross-file karg *override* is undefined.)
kargs = ["kvm.ignore_msrs=1", "kvm.report_ignored_msrs=0"]
