# Recreate the swtpm /var directories that bootc/ostree drops.
#
# The swtpm-tools RPM ships these pre-created with the right owner/mode, but
# ostree does not populate RPM-owned content under /var (it's machine-local and
# starts empty), so on a fresh boot they're missing. swtpm_setup then fails:
#   - it can't create /var/lib/swtpm-localca as tss (the local-CA state dir), and
#   - virtqemud can't create the /var/log/swtpm log tree under enforcing SELinux.
# systemd-tmpfiles recreates them at boot, before libvirt needs them. (The log
# files inside end up virt_log_t; swtpm's write to them is allowed by the
# bluefin-gdx-swtpm SELinux module.)
#
# Perms mirror EXACTLY what libvirt sets up at runtime (confirmed by ls on a
# working host): the two parents are 0711 root:root — traverse-only, so tss
# passes through but can't list — and the qemu leaf is 0730 tss:tss, because
# swtpm runs as tss and writes its per-VM log file there (so it owns that dir).
# The localca dir is tss-owned 0750 (per the swtpm-tools RPM), keeping the CA
# key private. Labels default to var_log_t / var_lib_t (matchpathcon); the log
# files inside become virt_log_t, which the bluefin-gdx-swtpm module allows.
# Type  Path                              Mode  User  Group  Age  Argument
d       /var/log/swtpm                    0711  root  root   -
d       /var/log/swtpm/libvirt            0711  root  root   -
d       /var/log/swtpm/libvirt/qemu       0730  tss   tss    -
d       /var/lib/swtpm-localca            0750  tss   root   -
